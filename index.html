<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的导航 · hy521</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }
  header { background:linear-gradient(135deg,#1d4ed8,#7c3aed); padding:34px 16px 26px; text-align:center; }
  header h1 { font-size:30px; letter-spacing:2px; }
  header p { margin-top:8px; opacity:.85; font-size:14px; }
  .search { max-width:520px; margin:18px auto 0; }
  .search input { width:100%; padding:11px 16px; border-radius:999px; border:none; font-size:15px; outline:none; }
  main { max-width:1020px; margin:0 auto; padding:8px 16px 30px; }
  h2 { font-size:19px; margin:26px 2px 12px; padding-left:10px; border-left:4px solid #38bdf8; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px; }
  @media (max-width:640px) { .grid { grid-template-columns:repeat(2,1fr); gap:10px; } a.card, div.card { padding:12px; } .card .name { font-size:15px; } .card .desc { font-size:12px; } }
  a.card, div.card { display:block; background:#1e293b; border:1px solid #334155; border-radius:12px; padding:16px; text-decoration:none; color:#e2e8f0; transition:transform .15s,border-color .15s; }
  a.card:hover { transform:translateY(-3px); border-color:#38bdf8; }
  .card .icon { font-size:28px; }
  .card .icon img { width:30px; height:30px; border-radius:6px; }
  .card .name { font-size:17px; font-weight:bold; margin:8px 0 5px; }
  .card .desc { font-size:13px; color:#94a3b8; line-height:1.55; }
  .tag { display:inline-block; font-size:11px; background:#0ea5e9; color:#fff; border-radius:6px; padding:1px 7px; margin-top:9px; margin-right:5px; }
  .tag.gray { background:#475569; }
  .card.empty { opacity:.45; border-style:dashed; }
  footer { text-align:center; color:#64748b; font-size:13px; padding:6px 16px 30px; }
  .hidden { display:none !important; }
  a.card, div.card { position:relative; }
  .catb { background:#475569; color:#fff; border:none; border-radius:999px; height:22px; padding:0 9px; font-size:12px; cursor:pointer; margin-left:6px; vertical-align:middle; }
  .moveb { position:absolute; bottom:6px; background:#475569; color:#fff; border:none; border-radius:999px; height:24px; padding:0 10px; font-size:12px; cursor:pointer; line-height:1; z-index:2; }
  .editb { position:absolute; top:6px; right:38px; background:#475569; color:#fff; border:none; border-radius:999px; height:24px; padding:0 10px; font-size:12px; cursor:pointer; line-height:1; z-index:2; }
  .del { position:absolute; top:6px; right:8px; background:#dc2626; color:#fff; border:none; border-radius:999px; width:24px; height:24px; font-size:14px; cursor:pointer; line-height:1; z-index:2; }
  #manageBtn { background:#334155; color:#e2e8f0; border:1px solid #475569; border-radius:999px; padding:7px 18px; font-size:14px; cursor:pointer; }
  .admin { max-width:520px; margin:14px auto 0; background:#1e293b; border:1px solid #334155; border-radius:12px; padding:14px; text-align:left; }
  .admin input, .admin select { width:100%; padding:9px 11px; margin:5px 0; border-radius:8px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; font-size:14px; }
  .admin button { background:#0284c7; color:#fff; border:none; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; margin-top:6px; margin-right:6px; }
  .admin .msg { font-size:13px; color:#fbbf24; margin-top:8px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <h1>🧭 我的导航</h1>
  <p>hy521 的私人收藏夹 · 好用的都在这儿</p>
  <div class="search"><input id="q" type="text" placeholder="搜一下，比如：音乐 / AI / 网盘 …"></div>
  <div style="margin-top:12px;"><button id="manageBtn">✏️ 管理收藏（加 / 删）</button></div>
  <div id="adminPanel" class="admin hidden">
    <div id="tokenRow">
      <div style="font-size:14px;line-height:1.6;">输入你设置的口令就能管理收藏。口令只在云盒上核对，网页里不存、别人看不到。</div>
      <input id="tokenInput" type="password" placeholder="输入口令">
      <button id="saveTokenBtn">进入管理</button>
    </div>
    <div id="addForm" class="hidden">
      <select id="fCat"></select>
      <input id="fNewCat" placeholder="或新分类名（如 📚 学习），填了就建新分类">
      <input id="fName" placeholder="名字（如 酷安）">
      <input id="fUrl" placeholder="网址（https://…；只做说明卡就填 -）">
      <input id="fDesc" placeholder="说明（可不填）">
      <input id="fIcon" placeholder="图标 emoji（可不填，不填自动抓网站图标）">
      <input id="fTag" placeholder="标签（可不填，多个用 / 隔开）">
      <button id="addBtn">＋ 添加</button>
      <button id="exitAdminBtn" style="background:#475569;">退出管理</button>
      <div style="font-size:13px;color:#94a3b8;margin-top:8px;line-height:1.6;">删除：点卡片右上角的红 ✕。保存立刻生效，手机电脑打开都是最新的。</div>
    </div>
    <div id="adminMsg" class="msg"></div>
  </div>
</header>
<main id="app">
  <p id="loading" style="color:#94a3b8;padding:24px 2px;">正在加载我的收藏…云盒睡着时要先把它叫醒，稍等一下。</p>
</main>
<footer>链接都在 links.txt 清单里，加删自己改 · 用 GitHub Pages 免费托管</footer>
<script>
  var q = document.getElementById('q');
  q.addEventListener('input', function () {
    var v = q.value.trim().toLowerCase();
    document.querySelectorAll('.card').forEach(function (c) {
      c.classList.toggle('hidden', v && c.textContent.toLowerCase().indexOf(v) === -1);
    });
  });
</script>
<script>
  var app = document.getElementById('app');
  function makeCard(p) {
    var hasUrl = p[1] && p[1] !== '-';
    var el = document.createElement(hasUrl ? 'a' : 'div');
    el.className = 'card';
    var url = '';
    if (hasUrl) {
      url = p[1];
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      el.href = url;
    }
    var icon = document.createElement('div');
    icon.className = 'icon';
    if (p[3]) {
      icon.textContent = p[3];
    } else if (hasUrl) {
      var img = document.createElement('img');
      img.alt = '';
      img.onerror = function () { icon.textContent = '🔗'; };
      try { img.src = new URL(url).origin + '/favicon.ico'; } catch (e) { icon.textContent = '🔗'; }
      icon.appendChild(img);
    } else {
      icon.textContent = '🔗';
    }
    var name = document.createElement('div');
    name.className = 'name'; name.textContent = p[0];
    el.appendChild(icon); el.appendChild(name);
    if (p[2]) { var d = document.createElement('div'); d.className = 'desc'; d.textContent = p[2]; el.appendChild(d); }
    if (p[4]) {
      p[4].split('/').forEach(function (tag, idx) {
        tag = tag.trim(); if (!tag) return;
        var s = document.createElement('span');
        s.className = 'tag' + (idx > 0 ? ' gray' : '');
        s.textContent = tag;
        el.appendChild(s);
      });
    }
    return el;
  }
  window.__renderLinks = function (txt) {
    app.innerHTML = '';
    window.__cats = [];
    var grid = null, lastTitle = '';
    txt.split('\n').forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var m = line.match(/^【(.+)】$/);
      if (m) {
        lastTitle = m[1].trim();
        window.__cats = window.__cats || [];
        window.__cats.push(lastTitle);
        var h = document.createElement('h2');
        h.textContent = lastTitle;
        var g = document.createElement('div');
        g.className = 'grid';
        app.appendChild(h); app.appendChild(g);
        grid = g;
        return;
      }
      if (line.charAt(0) === '#') return;
      if (!grid) {
        var h0 = document.createElement('h2');
        h0.textContent = '⭐ 常用站点';
        var g0 = document.createElement('div');
        g0.className = 'grid';
        app.appendChild(h0); app.appendChild(g0);
        grid = g0; lastTitle = '⭐ 常用站点';
      }
      var p = line.split('|').map(function (s) { return s.trim(); });
      if (p.length < 2 || !p[0]) return;
      var card = makeCard(p);
      card.dataset.line = line;
      card.dataset.cat = lastTitle;
      grid.appendChild(card);
    });
  };
  var BOXURL = 'https://8001-agqw4jubuknq6mjk7wjgxj5ejq.instabox.tech';
  function fetchBoxLinks() {
    var ctl = new AbortController();
    var timer = setTimeout(function () { ctl.abort(); }, 60000);
    return fetch(BOXURL + '/links.txt', {cache: 'no-store', signal: ctl.signal}).then(function (r) { clearTimeout(timer); if (!r.ok) throw new Error('box'); return r.text(); });
  }
  fetchBoxLinks().catch(function () {
    return fetch('links.txt', {cache: 'no-store'}).then(function (r) { return r.text(); });
  }).then(function (txt) { window.__renderLinks(txt); }).catch(function () {
    var loading = document.getElementById('loading');
    if (loading) loading.textContent = '收藏加载失败，刷新一下再试。';
  });
</script>
<div id="confirmMask" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:center;justify-content:center;">
  <div style="background:#1e293b;border:1px solid #475569;border-radius:14px;padding:20px;max-width:300px;width:86%;text-align:center;">
    <div id="confirmText" style="font-size:16px;line-height:1.6;color:#e2e8f0;"></div>
    <div style="margin-top:16px;">
      <button id="confirmNo" style="background:#475569;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:15px;margin-right:10px;cursor:pointer;">取消</button>
      <button id="confirmYes" style="background:#dc2626;color:#fff;border:none;border-radius:8px;padding:9px 18px;font-size:15px;cursor:pointer;">确定删</button>
    </div>
  </div>
</div>
<script>
  var manageBtn = document.getElementById('manageBtn');
  var adminPanel = document.getElementById('adminPanel');
  var tokenRow = document.getElementById('tokenRow');
  var addForm = document.getElementById('addForm');
  var adminMsg = document.getElementById('adminMsg');
  var managing = false;
  var pendingDeleteLine = null;
  function askDelete(line, name) {
    pendingDeleteLine = line;
    document.getElementById('confirmText').textContent = '确定删掉「' + (name || '') + '」吗？删掉后要重新添加才能恢复。';
    document.getElementById('confirmMask').classList.remove('hidden');
  }
  document.getElementById('confirmYes').onclick = function () {
    document.getElementById('confirmMask').classList.add('hidden');
    if (pendingDeleteLine) { var l = pendingDeleteLine; pendingDeleteLine = null; deleteLine(l); }
  };
  document.getElementById('confirmNo').onclick = function () {
    pendingDeleteLine = null;
    document.getElementById('confirmMask').classList.add('hidden');
  };
  document.getElementById('confirmMask').addEventListener('click', function (ev) {
    if (ev.target === this) { pendingDeleteLine = null; this.classList.add('hidden'); }
  });
  function msg(s) { adminMsg.textContent = s || ''; }
  function pass() { return sessionStorage.getItem('nav_pass') || ''; }
  function boxGetText() {
    return fetch(BOXURL + '/links.txt', {cache: 'no-store'}).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); });
  }
  function boxAuth(pw) {
    return fetch(BOXURL + '/auth', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pw})})
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function boxSave(content) {
    return fetch(BOXURL + '/save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: pass(), content: content})})
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function fillCats() {
    var sel = document.getElementById('fCat');
    sel.innerHTML = '';
    (window.__cats || []).forEach(function (c) {
      var o = document.createElement('option');
      o.value = c; o.textContent = '加到：' + c;
      sel.appendChild(o);
    });
  }
  function addBadges() {
    removeBadges();
    document.querySelectorAll('#app .card').forEach(function (card) {
      if (!card.dataset || !card.dataset.line) return;
      var b = document.createElement('button');
      b.className = 'del'; b.textContent = '✕';
      b.onclick = function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        var nm = (card.dataset.line || '').split('|')[0].trim();
        askDelete(card.dataset.line, nm);
      };
      card.appendChild(b);
      var eb = document.createElement('button');
      eb.className = 'editb'; eb.textContent = '改';
      eb.onclick = function (ev) {
        ev.preventDefault(); ev.stopPropagation();
        startEdit(card);
      };
      card.appendChild(eb);
      var up = document.createElement('button');
      up.className = 'moveb'; up.textContent = '↑'; up.style.right = '44px';
      up.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); moveLine(card.dataset.line, -1); };
      card.appendChild(up);
      var dn = document.createElement('button');
      dn.className = 'moveb'; dn.textContent = '↓'; dn.style.right = '8px';
      dn.onclick = function (ev) { ev.preventDefault(); ev.stopPropagation(); moveLine(card.dataset.line, 1); };
      card.appendChild(dn);
    });
    document.querySelectorAll('#app h2').forEach(function (h) {
      var title = h.textContent;
      var up = document.createElement('button');
      up.className = 'catb'; up.textContent = '↑ 分类';
      up.onclick = function (ev) { ev.preventDefault(); moveCategory(title, -1); };
      var dn2 = document.createElement('button');
      dn2.className = 'catb'; dn2.textContent = '↓ 分类';
      dn2.onclick = function (ev) { ev.preventDefault(); moveCategory(title, 1); };
      h.appendChild(up); h.appendChild(dn2);
    });
  }
  function removeBadges() {
    document.querySelectorAll('.del, .moveb, .editb, .catb').forEach(function (b) { b.remove(); });
  }
  function showForm() { tokenRow.classList.add('hidden'); addForm.classList.remove('hidden'); fillCats(); addBadges(); }
  function enterManage() {
    managing = true;
    adminPanel.classList.remove('hidden');
    if (pass()) { showForm(); }
    else { tokenRow.classList.remove('hidden'); addForm.classList.add('hidden'); }
  }
  function exitManage() {
    managing = false;
    sessionStorage.removeItem('nav_pass');
    resetEditing();
    adminPanel.classList.add('hidden');
    removeBadges(); msg('');
  }
  manageBtn.onclick = function () { managing ? exitManage() : enterManage(); };
  document.getElementById('exitAdminBtn').onclick = exitManage;
  document.getElementById('saveTokenBtn').onclick = function () {
    var v = document.getElementById('tokenInput').value;
    if (!v) { msg('先输入口令。'); return; }
    msg('正在核对口令…（云盒睡着时要等它醒，稍等）');
    boxAuth(v).then(function () {
      sessionStorage.setItem('nav_pass', v);
      msg('口令对了，开始管理吧。');
      showForm();
    }).catch(function () { msg('口令不对，再试试。'); });
  };
  var editingLine = null, editingCat = '';
  function startEdit(card) {
    var p = (card.dataset.line || '').split('|').map(function (s) { return s.trim(); });
    editingLine = card.dataset.line; editingCat = card.dataset.cat || '';
    document.getElementById('fName').value = p[0] || '';
    document.getElementById('fUrl').value = p[1] || '';
    document.getElementById('fDesc').value = p[2] || '';
    document.getElementById('fIcon').value = p[3] || '';
    document.getElementById('fTag').value = p[4] || '';
    document.getElementById('fNewCat').value = '';
    var sel = document.getElementById('fCat');
    for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === editingCat) { sel.selectedIndex = i; break; } }
    document.getElementById('addBtn').textContent = '💾 保存修改';
    msg('正在改「' + (p[0] || '') + '」，改完点「保存修改」；不想改了就退出管理。');
    adminPanel.scrollIntoView({behavior: 'smooth', block: 'center'});
  }
  function resetEditing() {
    editingLine = null; editingCat = '';
    document.getElementById('addBtn').textContent = '＋ 添加';
  }
  function insertLine(text, catTitle, line) {
    var lines = text.split('\n');
    var headIdx = -1;
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].trim().match(/^【(.+)】$/);
      if (m && m[1].trim() === catTitle) { headIdx = i; break; }
    }
    if (headIdx === -1) {
      var base = text.replace(/\s+$/, '');
      return base + '\n\n【' + catTitle + '】\n' + line + '\n';
    }
    var end = lines.length;
    for (var j = headIdx + 1; j < lines.length; j++) {
      if (/^【.+】$/.test(lines[j].trim())) { end = j; break; }
    }
    var insertAt = end;
    while (insertAt > headIdx + 1 && lines[insertAt - 1].trim() === '') insertAt--;
    lines.splice(insertAt, 0, line);
    return lines.join('\n');
  }
  document.getElementById('addBtn').onclick = function () {
    var name = document.getElementById('fName').value.trim();
    var url = document.getElementById('fUrl').value.trim();
    if (!name || !url) { msg('名字和网址都要填。'); return; }
    var desc = document.getElementById('fDesc').value.trim();
    var icon = document.getElementById('fIcon').value.trim();
    var tag = document.getElementById('fTag').value.trim();
    var newCat = document.getElementById('fNewCat').value.trim();
    var cat = newCat || document.getElementById('fCat').value;
    if (!cat) { msg('先选个分类，或者填一个新分类名。'); return; }
    var parts = [name, url];
    if (desc || icon || tag) parts.push(desc);
    if (icon || tag) parts.push(icon);
    if (tag) parts.push(tag);
    var line = parts.join(' | ');
    var wasEdit = !!editingLine;
    msg('正在保存…');
    boxGetText().then(function (text) {
      var updated;
      if (wasEdit) {
        var lines = text.split('\n');
        var idx = -1;
        for (var i = 0; i < lines.length; i++) { if (lines[i].trim() === editingLine.trim()) { idx = i; break; } }
        if (idx === -1) { msg('没找到原来那条，可能已经被删了。'); return null; }
        if (cat === editingCat) { lines[idx] = line; updated = lines.join('\n'); }
        else { lines.splice(idx, 1); updated = insertLine(lines.join('\n'), cat, line); }
      } else {
        updated = insertLine(text, cat, line);
      }
      return boxSave(updated).then(function () { return updated; });
    }).then(function (updated) {
      if (!updated) return;
      msg(wasEdit ? '改好了！' : '加好了！');
      resetEditing();
      window.__renderLinks(updated);
      if (managing) addBadges();
      document.getElementById('fName').value = ''; document.getElementById('fUrl').value = '';
      document.getElementById('fDesc').value = ''; document.getElementById('fIcon').value = ''; document.getElementById('fTag').value = ''; document.getElementById('fNewCat').value = '';
    }).catch(function (e) { msg('没存上（' + e.message + '）。云盒可能在冷却，先开一下云盒唤醒页等等再试。'); });
  };
  function moveLine(line, dir) {
    boxGetText().then(function (text) {
      var lines = text.split('\n');
      var idx = -1;
      for (var i = 0; i < lines.length; i++) { if (lines[i].trim() === line.trim()) { idx = i; break; } }
      if (idx === -1) { msg('没找到那一条。'); return null; }
      var j = idx + dir;
      while (j >= 0 && j < lines.length) {
        var s = lines[j].trim();
        if (s === '' || s.charAt(0) === '#') { j += dir; continue; }
        break;
      }
      if (j < 0 || j >= lines.length || /^【.+】$/.test(lines[j].trim())) { msg('已经到边了，挪不动。'); return null; }
      var tmp = lines[idx]; lines[idx] = lines[j]; lines[j] = tmp;
      var updated = lines.join('\n');
      return boxSave(updated).then(function () { return updated; });
    }).then(function (updated) {
      if (!updated) return;
      msg('顺序已保存。');
      window.__renderLinks(updated);
      if (managing) addBadges();
    }).catch(function (e) { msg('没挪成（' + e.message + '）。'); });
  }
  function moveCategory(title, dir) {
    boxGetText().then(function (text) {
      var lines = text.split('\n');
      var starts = [];
      for (var i = 0; i < lines.length; i++) { if (/^【.+】$/.test(lines[i].trim())) starts.push(i); }
      var bi = -1;
      for (var k = 0; k < starts.length; k++) {
        var m = lines[starts[k]].trim().match(/^【(.+)】$/);
        if (m && m[1].trim() === title) { bi = k; break; }
      }
      if (bi === -1) { msg('没找到这个分类。'); return null; }
      var bj = bi + dir;
      if (bj < 0 || bj >= starts.length) { msg('分类已经到边了，挪不动。'); return null; }
      function range(b) { return [starts[b], (b + 1 < starts.length ? starts[b + 1] : lines.length)]; }
      var ra = range(bi), rb = range(bj);
      var lo = Math.min(ra[0], rb[0]), hi = Math.max(ra[1], rb[1]);
      var head = lines.slice(0, lo);
      var blockA = lines.slice(ra[0], ra[1]);
      var blockB = lines.slice(rb[0], rb[1]);
      var tail = lines.slice(hi);
      var out = dir < 0 ? head.concat(blockA, blockB, tail) : head.concat(blockB, blockA, tail);
      var updated = out.join('\n');
      return boxSave(updated).then(function () { return updated; });
    }).then(function (updated) {
      if (!updated) return;
      msg('分类顺序已保存。');
      window.__renderLinks(updated);
      if (managing) addBadges();
    }).catch(function (e) { msg('没挪成（' + e.message + '）。'); });
  }
  function deleteLine(line) {
    msg('正在删除…');
    boxGetText().then(function (text) {
      var lines = text.split('\n');
      var idx = -1;
      for (var i = 0; i < lines.length; i++) { if (lines[i].trim() === line.trim()) { idx = i; break; } }
      if (idx === -1) { msg('没找到那一行，可能已经删过了。'); return null; }
      lines.splice(idx, 1);
      var updated = lines.join('\n');
      return boxSave(updated).then(function () { return updated; });
    }).then(function (updated) {
      if (!updated) return;
      msg('删好了。');
      window.__renderLinks(updated);
      if (managing) addBadges();
    }).catch(function (e) { msg('没删掉（' + e.message + '）。'); });
  }
</script>
</body>
</html>
